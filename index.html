<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>1 Purple Kow</title>
  <meta name="description" content="1 Purple Kow — releases, behind the scenes and upcoming work from Director Cricket.">
  <meta name="theme-color" content="#0a0710">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="locked">
  <div class="ambient" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- PRIVATE SCREENING (password intro) -->
  <section id="gate" class="gate" aria-label="Enter password">
    <canvas class="gate-canvas" data-scene="haze" data-seed="7"></canvas>
    <div class="letterbox top"><span>Reel 01</span><span>2.39 : 1 &nbsp;·&nbsp; 24 fps</span></div>
    <div class="gate-inner">
      <h1 class="gate-title">1 Purple Kow</h1>
      <p class="gate-sub">director cricket — private screening</p>
      <form id="gate-form" class="gate-form" autocomplete="off">
        <label for="gate-input" class="sr-only">Password</label>
        <input id="gate-input" type="password" placeholder="password" autofocus>
        <button type="submit">enter</button>
      </form>
      <p id="gate-error" class="gate-error" role="alert"></p>
    </div>
    <div class="letterbox bottom"><span id="timecode">00:00:00:00</span><span>&copy; <span class="year"></span> 1 Purple Kow</span></div>
  </section>

  <!-- SITE -->
  <div id="site" class="site" hidden>
    <header class="topbar">
      <a href="#" class="brand" data-home><span id="brand-name"></span> — <span id="brand-role"></span></a>
      <nav class="nav" aria-label="Main">
        <a href="#releases">releases</a>
        <a href="#bts">bts</a>
        <a href="#upcoming">upcoming</a>
        <a href="#contact">contact</a>
        <span class="nav-icons" id="nav-icons"></span>
      </nav>
      <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
    </header>

    <div class="mobile-menu" id="mobile-menu">
      <a href="#">home</a>
      <a href="#releases">releases</a>
      <a href="#bts">bts</a>
      <a href="#upcoming">upcoming</a>
      <a href="#contact">contact</a>
      <div class="mobile-icons" id="mobile-icons"></div>
    </div>

    <main id="view" class="view"></main>

    <footer class="footer">
      <div class="footer-icons" id="footer-icons"></div>
      <p>All films &amp; photographs &copy; <span class="year"></span> 1 Purple Kow</p>
    </footer>
  </div>

  <!-- VIDEO LIGHTBOX -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Close">close</button>
    <div class="lightbox-frame" id="lightbox-frame"></div>
  </div>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
